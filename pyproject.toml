[project]
name = "simulacat"
version = "0.1.0"
description = "simulacat package"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "ISC" }
authors = [{ name = "Payton McIntosh", email = "pmcintosh@df12.net" }]
keywords = ["github", "simulator", "testing", "pytest", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pytest",
    "Topic :: Software Development :: Testing",
]
dependencies = ["github3.py>=3.2.0,<5.0.0"]

[project.entry-points.pytest11]
simulacat = "simulacat.pytest_plugin"

[dependency-groups]
dev = [
    "pytest",
    "pytest-bdd",
    "pyyaml",
    "ruff==0.16.8",  # keep in step with RUFF_VERSION in the Makefile
    "pytest-timeout",
    "pytest-xdist",
    "hatchling",
]

[tool.ruff]
line-length = 88
preview = true
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "A",        # detect shadowed builtins
    "BLE",      # disallow catch-all exceptions
    "S",        # disallow things like "exec"; also restricts "assert" but I just NOQA it when I really need it
    "DTZ",      # require strict timezone manipulation with datetime
    "FBT",      # detect boolean traps
    "N",        # enforce naming conventions, e.g. ClassName vs function_name
    "FURB",
    "B",
    "RUF",
    "LOG",
    "Q",
    "PT",
    "RSE",
    "PERF",
    "TRY",
    "D",
    "ANN",
    "C90",
    "PLR",
    "modified-iterating-set",
    "no-classmethod-decorator",
    "no-staticmethod-decorator",
    "too-many-locals",
    "too-many-boolean-expressions",
    "too-many-nested-blocks",
    "non-augmented-assignment",
    "literal-membership",
    "no-self-use",
    "unnecessary-lambda",
    "none-not-at-end-of-union",
    "class-with-mixed-type-vars",
    "unnecessary-regular-expression",
    "non-octal-permissions",
    "property-without-return",
]
extend-ignore = [
    "incorrect-blank-line-before-class",  # Conflicts with D211; prefer enforcing no blank line before class docstring.
    "multi-line-summary-second-line",  # Conflicts with D212; keep summary on the first line.
    "invalid-todo-tag", # Permit FIXME and XXX tags alongside TODO.
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["assert", "too-many-arguments", "magic-value-comparison"]
"tests/steps/*.py" = ["assert", "too-many-arguments", "magic-value-comparison"]

[tool.ruff.lint.flake8-import-conventions]
# Declare the banned `from` imports.
banned-from = [
    "typing",
    "datetime",
    "collections.abc",
    "dataclasses",
    "enum",
    "unittest.mock",
    "msgspec",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
# Declare the default aliases.
altair = "alt"
"matplotlib.pyplot" = "plt"
numpy = "np"
pandas = "pd"
seaborn = "sns"
scipy = "sp"
"collections.abc" = "cabc"
datetime = "dt"
"unittest.mock" = "mock"
"msgspec.json" = "msjson"
typing = "typ"

[tool.ruff.lint.mccabe]
max-complexity = 9

[tool.ruff.lint.pylint]
max-args = 4

[tool.pytest.ini_options]
# Tests automatically killed after seconds elapsed
timeout = 30
markers = [
    "slow: long-running or packaging-related tests",
    "packaging: builds distribution artifacts",
]
addopts = "-m 'not slow'"

[tool.mutmut]
source_paths = ["simulacat/"]
pytest_add_cli_args_test_selection = ["tests/", "simulacat/unittests/"]
# In-package unit tests must run against mutants but never be mutated.
do_not_mutate = ["simulacat/unittests/*"]
# mutmut copies only tests/, pyproject.toml, and setup.cfg into its
# mutants/ working copy; the suite also reads these path-relative assets
# (docs/changelog.md, docs/users-guide.md, workflow files, reference
# projects, and the bundled simulator entrypoint).
also_copy = [
    "docs",
    ".github/workflows",
    "examples/reference-projects",
    "src",
    "package.json",
    "bun.lock",
]

[tool.uv]
package = true

[tool.hatch.build]
include = [
    "simulacat/**/*.py",
    "src/github-sim-server.ts",
    "package.json",
    "bun.lock",
]

[tool.hatch.build.force-include]
"src/github-sim-server.ts" = "simulacat/src/github-sim-server.ts"
"package.json" = "simulacat/package.json"
"bun.lock" = "simulacat/bun.lock"

[tool.hatch.build.targets.wheel]
packages = ["simulacat"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
