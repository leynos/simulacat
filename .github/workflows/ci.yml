name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install CLI tools
        env:
          # Pin every tool this job installs. `uv tool install ruff` with no
          # version is what turned main red at "Run ruff": it followed upstream
          # into a release rejecting 59 suppressions the tree already carried.
          # ruff and ty are no longer installed here; the Makefile runs one
          # pinned copy of each. biome and tsc come from bun.lock through
          # node_modules, which is what the Makefile invokes, so the global
          # copies and the tsgo symlink shadowing them are gone.
          MBAKE_VERSION: '1.4.6'
          NIXIE_CLI_VERSION: '1.1.0'
        run: |
          uv tool install "mbake==${MBAKE_VERSION}"
          uv tool install "nixie-cli==${NIXIE_CLI_VERSION}"

      - name: Install Node dependencies
        run: bun install

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          version: "0.6.0"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Enforce en-GB-oxendict spelling
        run: make spelling

      - name: Set up Rust for Merman
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0

      - name: Install Merman
        run: cargo +1.95.0 install merman-cli --version '=0.7.0' --locked

      - name: Validate Mermaid diagrams
        run: make nixie

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      # Pull requests compare their coverage against the baseline main writes.
      # Main owns publication, so this untrusted path receives no CodeScene
      # credentials and never needs CodeScene's merge-base history. A push to
      # main skips this step so that coverage-main.yml is the one writer of
      # the baseline, and publish-artefact is off because the report is
      # compared, not published.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        # Pinned to the interpreter setup-python installs, in both lanes:
        # the action builds its coverage environment with whatever
        # interpreter uv finds first, which an earlier step's managed
        # download can change, and a baseline measured on one Python is
        # not comparable with a lane measured on another.
        env:
          UV_PYTHON: '3.13'
        with:
          language: python
          python-source: ./simulacat
          output-path: coverage.xml
          format: cobertura
          pytest-workers: ''
          with-ratchet: 'true'
          publish-artefact: 'false'
