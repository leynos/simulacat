name: Coverage (main)

# CodeScene analyses main, so this workflow is the sole coverage publisher.
# Pull requests use the local ratchet baseline this workflow advances, so
# ci.yml's generate-coverage selection has to match the one below field for
# field. tests/workflow_contracts holds that shape.
#
# workflow_dispatch lets the upload be re-run on demand, because merges made
# by the automerge workflow's GITHUB_TOKEN fire no push event.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One publisher generation per ref at a time, never cancelled. GitHub
# keeps at most one pending run per group, so a newer push replaces an
# older pending run and the newest baseline wins; a cancelled run would
# abandon both its upload and its baseline write. The group carries the
# ref and the event so that no dispatch, from a branch or from main, can
# replace a pending push to main: a dispatch does not advance the
# baseline, so the push it displaced would leave that merge unpublished.
concurrency:
  group: coverage-main-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install Node dependencies
        run: bun install

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          language: python
          python-source: ./simulacat
          output-path: coverage.xml
          format: cobertura
          pytest-workers: ''
          with-ratchet: 'true'

      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        # The ref as well as the token: a dispatch can name any branch, and
        # without this guard it would upload that branch's coverage as main's.
        # With no CS_ACCESS_TOKEN secret the upload skips.
        if: env.CS_ACCESS_TOKEN != '' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          path: coverage.xml
          format: cobertura
          mode: upload
          access-token: ${{ env.CS_ACCESS_TOKEN }}
